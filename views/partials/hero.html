<section class="hero" id="inicio" aria-labelledby="hero-title">
  <div class="hero-copy">
    <p class="eyebrow"><span></span> Arte original, hecho a mano</p>
    <h1 id="hero-title">Un poco de belleza para <em>quedarse.</em></h1>
    <p class="hero-description">
      Pinturas que nacen despacio, entre recuerdos, naturaleza y pequeños
      momentos cotidianos.
    </p>
    <a class="button button-dark" href="#obras">
      Explorar las obras <span aria-hidden="true">↓</span>
    </a>
    <div class="hero-note">
      <span class="note-line" aria-hidden="true"></span>
      <span>Cada pieza es única. Como la historia que cuenta.</span>
    </div>
  </div>
  <div
    class="hero-art"
    id="hero-carousel"
    role="region"
    aria-label="Obras destacadas"
    aria-roledescription="carrusel"
  >
    <img class="hero-slide" alt="" fetchpriority="high" />
    <div class="art-caption">
      <span class="hero-caption-title"></span>
      <span class="hero-caption-count"></span>
    </div>
    <div class="hero-carousel-controls">
      <button
        class="hero-carousel-arrow"
        type="button"
        data-carousel-action="previous"
        aria-label="Mostrar obra anterior"
      >←</button>
      <div class="hero-carousel-dots" aria-label="Elegir obra"></div>
      <button
        class="hero-carousel-arrow"
        type="button"
        data-carousel-action="next"
        aria-label="Mostrar obra siguiente"
      >→</button>
    </div>
    <span class="hero-stamp" aria-hidden="true">pintado<br />con cariño</span>
  </div>
  <div class="hero-index" aria-hidden="true">01 — 03</div>
</section>
